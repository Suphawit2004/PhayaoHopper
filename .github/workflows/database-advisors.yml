name: Database advisors

on:
  schedule:
    - cron: "23 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      SUPABASE_PROJECT_REF: kvrwcfnvyaynlxrkefxh
    steps:
      - name: Check Management API access
        shell: bash
        run: |
          if [[ -z "$SUPABASE_MANAGEMENT_TOKEN" ]]; then
            echo "::error::Add the SUPABASE_MANAGEMENT_TOKEN repository secret with advisors_read permission to enable monthly database checks."
            exit 1
          fi

      - name: Read security and performance advisors
        shell: bash
        run: |
          set -euo pipefail
          for category in security performance; do
            response="$(mktemp)"
            status="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer ${SUPABASE_MANAGEMENT_TOKEN}" \
              --output "$response" --write-out '%{http_code}' \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/${category}")"
            if [[ "$status" != "200" ]]; then
              echo "::error::${category} advisor request returned HTTP ${status}"
              exit 1
            fi
            node - "$category" "$response" <<'NODE'
          const fs = require('node:fs');
          const [category, file] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(body.lints)) throw new Error(`${category} advisors returned an unexpected response`);
          const actionable = body.lints.filter(lint => ['WARN', 'ERROR'].includes(lint.level));
          const lines = [
            `### Supabase ${category} advisors`,
            `${actionable.length} warnings/errors, ${body.lints.length} total findings.`,
            '',
            '| Severity | Finding | Object |',
            '| --- | --- | --- |',
            ...actionable.map(lint => {
              const object = [lint.metadata?.schema, lint.metadata?.name || lint.metadata?.entity].filter(Boolean).join('.');
              return `| ${lint.level} | ${lint.name} | ${object || '—'} |`;
            }),
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log(`${category}: ${actionable.length} warnings/errors, ${body.lints.length} findings`);
          NODE
          done
