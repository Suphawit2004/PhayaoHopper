name: Production availability

on:
  schedule:
    # Run away from the top of the hour, when scheduled Actions are often delayed.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages from outside Vercel
        shell: bash
        run: |
          set -euo pipefail
          for path in / /cafes; do
            page="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 --output "$page" --write-out '%{http_code}' "https://phayaohopper.vercel.app${path}")"
            if [[ "$status" != "200" ]] || ! grep -q 'PhayaoHopper' "$page"; then
              echo "::error::Production ${path} returned HTTP ${status} or unexpected page content"
              exit 1
            fi
            echo "Production ${path}: HTTP ${status} and expected page content"
          done
