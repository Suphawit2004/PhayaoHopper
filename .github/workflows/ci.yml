name: CI

on:
  push:
    branches: [main, building]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Test database installation and access policies
        run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e
